<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Peças — Painel de Gestão Integrada</title>
    <!-- Tailwind CSS v4 Oficial -->
    <script src="https://unpkg.com"></script>
    <!-- Chart.js Oficial para Relatórios Gráficos -->
    <script src="https://jsdelivr.net"></script>
    <!-- Fonte Inter Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 antialiased min-h-screen flex flex-col md:flex-row select-none">

    <!-- MENU LATERAL DA OFICINA -->
    <aside class="w-full md:w-68 bg-[#111827] text-white flex flex-col flex-shrink-0 border-r border-slate-800/60">
        <!-- LOGO VETORIAL DIGITALIZADA -->
        <div class="p-7 flex flex-col items-center border-b border-slate-800/40">
            <div class="relative group">
                <div class="absolute -inset-1 bg-gradient-to-r from-blue-500 to-indigo-500 rounded-full blur opacity-25 group-hover:opacity-40 transition duration-1000"></div>
                <svg class="relative w-28 h-auto text-slate-100 drop-shadow-lg" viewBox="0 0 200 80" fill="none" xmlns="http://w3.org">
                    <path d="M20 52 C40 22, 70 18, 100 18 C130 18, 160 22, 180 52" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
                    <path d="M35 52 L45 43 L155 43 L165 52 Z" fill="currentColor" opacity="0.2"/>
                    <circle cx="55" cy="52" r="4" fill="#3b82f6"/>
                    <circle cx="145" cy="52" r="4" fill="#3b82f6"/>
                </svg>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-white mt-3 bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">CAR PEÇAS</h1>
            <p class="text-[10px] text-blue-400 font-bold tracking-[0.25em] uppercase mt-0.5">Peças & Serviços</p>
        </div>

        <!-- BOTÕES DE NAVEGAÇÃO -->
        <nav class="flex-1 p-5 space-y-1.5 overflow-y-auto hide-scrollbar">
            <button onclick="switchTab('dashboard')" id="btn-dashboard" class="tab-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl bg-blue-600 text-white font-medium text-sm transition-all duration-200 text-left shadow-lg shadow-blue-600/10">
                <span class="text-base">📊</span> <span>Painel de Controle</span>
            </button>
            <button onclick="switchTab('orcamentos')" id="btn-orcamentos" class="tab-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white font-medium text-sm transition-all duration-200 text-left">
                <span class="text-base">📋</span> <span>Orçamentos</span>
            </button>
            <button onclick="switchTab('ordens')" id="btn-ordens" class="tab-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white font-medium text-sm transition-all duration-200 text-left">
                <span class="text-base">🛠️</span> <span>Ordens de Serviço</span>
            </button>
            <button onclick="switchTab('estoque')" id="btn-estoque" class="tab-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white font-medium text-sm transition-all duration-200 text-left">
                <span class="text-base">📦</span> <span>Estoque de Peças</span>
            </button>
            <button onclick="switchTab('historico')" id="btn-historico" class="tab-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white font-medium text-sm transition-all duration-200 text-left">
                <span class="text-base">📜</span> <span>Histórico / Comissões</span>
            </button>
            <button onclick="switchTab('clientes')" id="btn-clientes" class="tab-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white font-medium text-sm transition-all duration-200 text-left">
                <span class="text-base">👥</span> <span>Clientes</span>
            </button>
            <button onclick="switchTab('veiculos')" id="btn-veiculos" class="tab-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white font-medium text-sm transition-all duration-200 text-left">
                <span class="text-base">🚗</span> <span>Veículos</span>
            </button>
        </nav>
    </aside>

    <!-- ÁREA DE EXIBIÇÃO DE CONTEÚDO -->
    <main class="flex-1 flex flex-col min-w-0 bg-[#0b0f19]">
        <!-- BARRA SUPERIOR -->
        <header class="bg-[#111827] border-b border-slate-800/60 h-18 flex items-center justify-between px-6 md:px-8 flex-shrink-0">
            <div class="flex items-center space-x-3 w-full max-w-xl">
                <div class="relative flex-1">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500 text-xs">🔍</span>
                    <input type="text" id="globalSearch" oninput="handleSearch()" placeholder="Pesquise por clientes, placas, mecânicos..." class="w-full pl-9 pr-4 py-2 bg-[#1f2937] border border-slate-700/60 rounded-xl text-xs focus:outline-none focus:border-blue-500 transition-all placeholder:text-slate-500 font-medium text-slate-100">
                </div>
                <button onclick="toggleFiltroAtrasadas()" id="btnFiltroAtrasadas" class="px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-700 transition-all flex items-center space-x-1 whitespace-nowrap">
                    <span>🚨</span> <span id="labelFiltroAtrasadas">Ver Atrasadas</span>
                </button>
            </div>
            <div class="flex items-center space-x-2 ml-4">
                <button onclick="exportarRelatorio('pdf')" class="px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-700 transition-all">📄 PDF</button>
                <button onclick="exportarRelatorio('csv')" class="px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-700 transition-all">📊 Excel</button>
            </div>
        </header>

        <!-- CONTEÚDO DINÂMICO -->
        <div class="p-6 md:p-8 flex-1 overflow-y-auto">
            <div id="estoqueAlertaGlobal" class="hidden mb-6 p-4 bg-rose-950/40 border border-rose-800/60 rounded-2xl flex items-center space-x-3 text-rose-300">
                <span class="text-lg">🚨</span>
                <div class="text-xs font-medium">Aviso de Estoque: Existem itens abaixo do limite de segurança!</div>
            </div>

            <!-- DASHBOARD -->
            <section id="tab-dashboard" class="space-y-6 tab-content">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-[#111827] p-6 rounded-2xl border border-slate-800/60 shadow-xs flex items-center justify-between">
                        <div>
                            <p class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Faturamento Líquido</p>
                            <h3 id="dashFaturamento" class="text-2xl font-bold text-white mt-1">R$ 0,00</h3>
                        </div>
                        <div class="w-12 h-12 bg-emerald-950 text-emerald-400 rounded-xl flex items-center justify-center text-lg">💰</div>
                    </div>
                    <div class="bg-[#111827] p-6 rounded-2xl border border-slate-800/60 shadow-xs flex items-center justify-between">
                        <div>
                            <p class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Carros no Pátio</p>
                            <h3 id="dashAndamento" class="text-2xl font-bold text-white mt-1">0 Carros</h3>
                        </div>
                        <div class="w-12 h-12 bg-blue-950 text-blue-400 rounded-xl flex items-center justify-center text-lg">🛠️</div>
                    </div>
                    <div class="bg-[#111827] p-6 rounded-2xl border border-slate-800/60 shadow-xs flex items-center justify-between">
                        <div>
                            <p class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Orçamentos Pendentes</p>
                            <h3 id="dashPendentes" class="text-2xl font-bold text-white mt-1">0 Propostas</h3>
                        </div>
                        <div class="w-12 h-12 bg-amber-950 text-amber-400 rounded-xl flex items-center justify-center text-lg">⏳</div>
                    </div>
                </div>
                <div class="bg-[#111827] p-6 rounded-2xl border border-slate-800/60">
                    <h3 class="text-sm font-bold text-white mb-4">Fluxo de Caixa Mensal</h3>
                    <div class="h-64 relative"><canvas id="faturamentoChart"></canvas></div>
                </div>
            </section>

            <!-- TABELAS PADRÃO DO SISTEMA (GERADO VIA SCRIPT AUTOMÁTICO) -->
            <section id="tab-orcamentos" class="hidden space-y-6 tab-content">
                <div class="flex justify-between items-center">
                    <div>
                        <h2 class="text-base font-bold text-white">Módulo de Orçamentos</h2>
